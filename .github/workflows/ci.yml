# .github/workflows/ci.yml
name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: rolefindr, POSTGRES_USER: rolefindr, POSTGRES_PASSWORD: rolefindr }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rolefindr" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci
      DATABASE_URL: postgres://rolefindr:rolefindr@localhost:5432/rolefindr
      REDIS_URL: redis://localhost:6379/0
      CELERY_EAGER: "1"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm test && npm run build
  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: extension/package-lock.json }
      - run: npm ci && npm run lint && npm run build